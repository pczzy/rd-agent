# 实盘配置。所有可调参数集中在这里，代码不再硬编码。
# 数值来自 docs/worklog/WORKLOG.md 记录的 holdout 验证结果。

account:
  capital: 200000          # 账户总资金（元）
  max_positions: 30        # 最大持仓只数
  # 单只上限必须 >= 1/max_positions，否则两个约束互相打架：0.05 x 30 = 150% 看似宽松，
  # 但等权时每只只能拿 1/30 = 3.33%，而 5% 的上限让前 20 只就用完了资金，
  # 实际只建到 20 只。取 0.045 给等权留一点余量又不至于挤掉后面的名字。
  max_weight_per_stock: 0.045

universe:
  market: csi300
  benchmark: SH000300
  # 只交易滚动 20 日成交额排名前 liquidity_pct 的股票。
  # holdout 实测：不加此过滤时年化 -1.44%、回撤 -23.9%；加了 +10.23%、-9.6%。
  liquidity_pct: 0.50
  liquidity_window: 20

signal:
  # 预测 T+1 -> T+21 收益。CSI300 实测：5 日目标 Rank IC 0.0616，20 日 0.1265，
  # 净收益 -16.73% vs +17.51%（WORKLOG 零点五）。原注释写的"1 日目标"无出处，已更正。
  label_horizon: 21
  refresh_every_n_days: 10 # 信号每 N 个交易日更新一次，其余日沿用
  seed: 42                 # 固定随机种子，否则两次刷新的差异里混着重训噪声
  # 训练窗口随截止日自动后延（pipeline.rolling_segments）：
  #   valid 取截止日往前 label_horizon 个交易日为止的 valid_years 年，
  #   train 从 train_start 起、到 valid 开始前 label_horizon 个交易日为止（隔开标签重叠）。
  train_start: "2010-01-01"
  valid_years: 2

trading:
  lot_size: 100            # A 股一手
  # 单边成本的"按比例"部分，不含 5 元佣金下限：
  #   佣金 0.02354%（回单实测，见下）+ 过户 0.001% + 半价差 0.030%
  #   + 冲击 Y*sigma*sqrt(参与率) 0.085%（Y=1、sigma=2.29%，文献估算，未实测）
  #   = 0.13954% -> 0.140%
  # 下限另算：pipeline.estimate_cost 对佣金单独取 max(费率, min_commission)；
  # run_daily 给回测的 open_cost 则把下限折成按单笔均值的有效费率
  #   0.140% - 0.02354% + 5 / (capital / max_positions) ≈ 0.19%。
  # 本账户单笔约 6,667 元，远低于下限触发线 5 / 0.0002354 ≈ 21,240 元，所以每笔实际
  # 都付 5 元，有效单边成本仍是 ~0.19%，不是 0.14%。
  # 卖出侧再加印花税 0.05%（stamp_duty），由 run_daily 合成 close_cost。
  cost_one_side: 0.0014
  # 印花税：法定 1‰ 向出让方收取、减半征收 = 0.5‰。回单验证（2026-08-27 卖 山东黄金）：
  # 成交额 35,000 收 17.50，正好 0.05%。同一张单的过户费 0.35 = 0.001%，也与中国结算一致。
  stamp_duty: 0.0005       # 印花税，仅卖出
  min_commission: 5.0
  # 券商实际扣款。与上面的 cost_one_side 区分开：那是含价差和冲击的事前估算，只用于
  # 评估；这些是记账口径 —— 真金白银从账户里扣走的部分。两个出处：
  #
  # 国金证券《佣金标准》：A 股（沪/深/北）不超过成交金额 3‰、起点 5 元。并注明
  #   沪市：佣金含经手费、结算费、证管费；**过户费单独向客户收取**
  #   深市：佣金含经手费、结算费、证管费、**过户费**（不另收）
  #   北京及股转：佣金含经手费、结算费、过户费（同深市处理）
  #   印花税一律单独收取
  # 中国结算《市场证券登记结算业务收费及代收税费一览表》（2026-01-01 更新，沪深两份）：
  #   交易过户费 A 股 0.01‰ 双向（沪深一致）      -> transfer_rate 0.00001
  #   证券交易印花税 1‰ 向出让方，减半征收        -> stamp_duty 0.0005，仅卖出
  #   经手费 0.0341‰ 双向、证管费 0.02‰ 双向       -> 已含在佣金里，不单独计
  #   http://www.chinaclear.cn/zdjs/fbzyls/service_tlist.shtml
  # 实测费率。五张成交回单（三只股票、四个日期、沪深两市、买卖双向）逐项复现：
  #   2026-09-07 买 兆易创新  38,245 -> 9.00 ｜ 38,255 -> 9.01
  #   2026-09-10 卖 兆易创新  77,400 -> 18.22
  #   2026-08-27 卖 山东黄金  35,000 -> 8.24
  #   2026-09-04 买 阳光电源   8,880 -> 5.00（按费率只有 2.09，被 min_commission 顶上去）
  # 回单只有佣金/过户费/印花税三行、没有单列规费，所以经手费 0.0341‰ 和证管费 0.02‰
  # 应当已经并在这个佣金里。原先配置写的 0.00075 是凭印象填的，高了 3.2 倍。
  # 费率表问不出实际费率（只给 3‰ 上限，一户一议），只有回单能。
  commission_rate: 0.0002354 # 佣金费率（万 2.354，在 3‰ 上限内），不足 min_commission 按其收
  # 仅沪市单独计。深市回单（2026-09-04 阳光电源）的过户费一栏是 0.00，实证了费率表
  # "深市佣金包含过户费"的说法 —— 再单独加一遍就是重复计费。
  transfer_rate: 0.00001   # 过户费 0.01‰ 双向，**仅沪市**

risk:
  max_daily_turnover: 0.15   # 单日换手上限，超过则截断订单
  min_order_value: 3000      # 单笔低于此金额不下单（5 元佣金占比过高）
  halt_on_drawdown: 0.20     # 回撤超过此值停止开新仓，仅允许平仓
